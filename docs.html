<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glow Salon — API docs</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css"
  />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
    header {
      background: #7c3aed;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    header a { color: #fff; font-size: 14px; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <header>
    <strong>Glow Salon — API</strong>
    <a href="/">&larr; back to booking page</a>
  </header>

  <div id="swagger"></div>

  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: "/openapi.json",
      dom_id: "#swagger",
      docExpansion: "list"
    });
  </script>
</body>
</html>
