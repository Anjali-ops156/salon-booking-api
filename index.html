<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glow Salon — Book an Appointment</title>
  <style>
    :root {
      --purple: #7c3aed;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: #faf9ff;
    }
    header {
      background: var(--purple);
      color: #fff;
      padding: 28px 24px;
    }
    header h1 { margin: 0 0 4px; font-size: 26px; }
    header p { margin: 0; opacity: .85; font-size: 15px; }
    header a { color: #fff; font-size: 14px; }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) {
      main { grid-template-columns: 1fr 1fr; }
    }
    section {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
    }
    h2 { margin: 0 0 16px; font-size: 17px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    button {
      margin-top: 18px;
      width: 100%;
      padding: 11px;
      background: var(--purple);
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .msg { margin-top: 12px; font-size: 14px; padding: 10px; border-radius: 8px; }
    .ok  { background: #ecfdf5; color: #065f46; }
    .err { background: #fef2f2; color: #991b1b; }
    .booking {
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .booking:last-child { border-bottom: 0; }
    .booking strong { display: block; font-size: 15px; }
    .booking span { font-size: 13px; color: var(--muted); }
    .when { font-size: 13px; text-align: right; white-space: nowrap; }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Glow Salon</h1>
    <p>Book your appointment online &nbsp;·&nbsp; <a href="/docs.html">API docs</a></p>
  </header>

  <main>
    <section>
      <h2>Book an appointment</h2>
      <form id="form">
        <label for="name">Your name</label>
        <input id="name" required placeholder="Anjali Sharma" />

        <label for="phone">Phone number</label>
        <input id="phone" required placeholder="9876543210" />

        <label for="service">Service</label>
        <select id="service" required>
          <option>Haircut</option>
          <option>Facial</option>
          <option>Hair Spa</option>
          <option>Manicure</option>
          <option>Pedicure</option>
          <option>Hair Colour</option>
        </select>

        <label for="stylist">Stylist (optional)</label>
        <input id="stylist" placeholder="Any" />

        <label for="time">Date &amp; time</label>
        <input id="time" type="datetime-local" required />

        <button type="submit">Book now</button>
      </form>
      <div id="msg"></div>
    </section>

    <section>
      <h2>Upcoming bookings</h2>
      <div id="list" class="empty">Loading…</div>
    </section>
  </main>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const list = document.getElementById("list");

    function show(text, kind) {
      msg.className = "msg " + kind;
      msg.textContent = text;
    }

    async function loadBookings() {
      try {
        const res = await fetch("/api/appointments");
        const data = await res.json();

        if (!res.ok) {
          list.className = "empty";
          list.textContent = data.error || "Could not load bookings.";
          return;
        }

        if (!data.length) {
          list.className = "empty";
          list.textContent = "No bookings yet.";
          return;
        }

        list.className = "";
        list.innerHTML = data
          .map(function (b) {
            const when = new Date(b.appointment_time).toLocaleString("en-IN", {
              dateStyle: "medium",
              timeStyle: "short"
            });
            return (
              '<div class="booking">' +
                "<div>" +
                  "<strong>" + b.customer_name + "</strong>" +
                  "<span>" + b.service + " · " + b.stylist + "</span>" +
                "</div>" +
                '<div class="when">' + when + "</div>" +
              "</div>"
            );
          })
          .join("");
      } catch (e) {
        list.className = "empty";
        list.textContent = "Could not load bookings.";
      }
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const button = form.querySelector("button");
      button.disabled = true;
      show("Booking…", "ok");

      const body = {
        customer_name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        service: document.getElementById("service").value,
        stylist: document.getElementById("stylist").value.trim() || "Any",
        appointment_time: new Date(
          document.getElementById("time").value
        ).toISOString()
      };

      try {
        const res = await fetch("/api/appointments", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (res.ok) {
          show("Appointment booked! See you soon.", "ok");
          form.reset();
          loadBookings();
        } else {
          show(data.error || "Something went wrong.", "err");
        }
      } catch (err) {
        show("Could not reach the server.", "err");
      } finally {
        button.disabled = false;
      }
    });

    loadBookings();
  </script>
</body>
</html>
